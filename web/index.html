<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060B0E">
<link rel="manifest" href="/manifest.webmanifest">
<script>
// beforeinstallprompt fires as soon as Chrome has read the manifest and
// decided the page is installable. app.js is a 700KB module - deferred by
// definition - so React's listener in InstallNudge could not mount until long
// after that, and the event does not wait or re-fire. Missing it left the
// nudge permanently in its no-event branch, where every click opens another
// tab and none of them ever asks (Jesse, 2026-08-24: "the install pixal
// button doesnt do anything beside opens it in chrome").
//
// An inline classic script in <head> is the earliest point this page can run
// code. Park the event on window and announce it, so the app can pick it up
// whenever it is ready - before OR after mount.
window.__pixalInstall = null;
addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  window.__pixalInstall = e;
  dispatchEvent(new Event("pixal:installable"));
});
addEventListener("appinstalled", function () { window.__pixalInstall = null; });
</script>
<!-- tile-16 and tile-32 are Jesse's own frames, drawn per-size in Figma - NOT
     generated by make_app_icon.py and not to be overwritten by it. Exact-size
     PNGs so the tab and title bar take them as-is with no resampling; do not
     add an SVG here, Chrome would prefer it as scalable and rasterise it soft
     at 16px. The .ico is still what the desktop shortcut uses.

     The ladder runs to 256 on purpose. When Pixal is installed as a PWA
     the TASKBAR button is not drawn from these at all - Chrome bakes its
     own Pixal.ico from the MANIFEST icons at install time. With only 192
     and 512 offered there it resampled all thirteen frames down from
     block-512.png: at 16px that is 96.9% blended pixels against 38.7% for
     the drawn frame, which is the mushy taskbar icon of 2026-08-18. Every
     size added here must be added to web/manifest.webmanifest too, or the
     taskbar goes back to guessing. -->
<link rel="icon" type="image/png" sizes="256x256" href="/icons/tile-256.png">
<link rel="icon" type="image/png" sizes="128x128" href="/icons/tile-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/tile-64.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/tile-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/tile-32.png">
<link rel="icon" type="image/png" sizes="24x24" href="/icons/tile-24.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/tile-16.png">
<link rel="apple-touch-icon" href="/icons/block-192.png">
<title>Pixal</title>
<style>
  html, body { margin: 0; height: 100%; background: #03080A; }
  #root { min-height: 100dvh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
